# Production: PostgreSQL storage for run_storage, event_log, schedule_storage.
# Requires dagster-postgres and DAGSTER_PG_* env vars.
storage:
  postgres:
    postgres_db:
      username:
        env: DAGSTER_PG_USERNAME
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      db_name:
        env: DAGSTER_PG_DB
      port:
        env: DAGSTER_PG_PORT
