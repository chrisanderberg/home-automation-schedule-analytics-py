[supervisord]
nodaemon=true
user=appuser

[program:dagster-webserver]
command=dagster-webserver -w /app/.dagster/workspace.yaml -h 0.0.0.0 -p 3000
directory=/app
user=appuser
environment=PYTHONPATH="/app/shared-logic/src:/app/reporting/src"
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dagster-daemon]
command=dagster-daemon run -w /app/.dagster/workspace.yaml
directory=/app
user=appuser
environment=PYTHONPATH="/app/shared-logic/src:/app/reporting/src"
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
