name: Refresh Aggregation Base Image

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  bump-python-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bump Python patch tag in aggregation Dockerfile
        run: python .github/scripts/bump_python_base_tag.py aggregation/Dockerfile

      - name: Create pull request for base image updates
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          add-paths: aggregation/Dockerfile
          branch: codex/aggregation-python-base-bump
          title: "chore(aggregation): bump Python base image patch version"
          commit-message: "chore(aggregation): bump Python base image patch version"
          body: |
            Automated update for `aggregation/Dockerfile` Python base image patch tag.
            This keeps patch-level security fixes current.
